server {
    listen 80;
    server_name handclinic.co.il www.handclinic.co.il;
    return 301 https://dr.handclinic.co.il$request_uri;
}

server {
    listen 80 default_server;
    server_name dr.handclinic.co.il _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
