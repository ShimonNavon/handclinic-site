apiVersion: v1
kind: Namespace
metadata:
  name: handclinic-ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: handclinic-ci
---
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: handclinic-ci
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: handclinic-deployer
  namespace: handclinic
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "pods", "pods/log", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: handclinic-deployer
  namespace: handclinic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: handclinic-deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: handclinic-ci
