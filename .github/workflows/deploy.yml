name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handclinic-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path('index.html').read_text()
          HTMLParser().feed(html)
          for p in ['assets/hero.jpg', 'nginx/default.conf', 'k8s.yaml']:
              assert Path(p).exists(), p
          print('site files ok')
          PY

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, handclinic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to cluster
        run: ./deploy-ci.sh
