apiVersion: v1
kind: Namespace
metadata:
  name: handclinic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: handclinic
  labels:
    app: handclinic-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: handclinic-web
  template:
    metadata:
      labels:
        app: handclinic-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
            - name: img
              mountPath: /usr/share/nginx/html/img
      volumes:
        - name: site
          configMap:
            name: site
        - name: img
          configMap:
            name: site-img
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: handclinic
spec:
  type: NodePort
  selector:
    app: handclinic-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30094
      protocol: TCP
